<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Quién es ese Pokémon?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: una consola tipo Pokédex centrada; pantalla arriba, botonera abajo */
  :root {
    --shell: #c8102e;
    --shell-dark: #8e0b20;
    --screen: #dfe8d0;
    --screen-ink: #1d2b1a;
    --panel: #fdf7ee;
    --ink: #1b1b22;
    --muted: #6b6470;
    --gold: #ffcb05;
    --blue: #3b6fd4;
    --ok: #2f9e44;
    --bad: #d6336c;
    --font-display: "Press Start 2P", ui-monospace, monospace;
    --font-body: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 20% 10%, #2a2340, #120f1c 70%);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 16px;
  }
  .dex {
    width: 100%; max-width: 560px;
    background: var(--shell);
    border-radius: 20px 20px 20px 60px;
    padding: 20px;
    box-shadow: inset 0 -8px 0 var(--shell-dark), 0 20px 50px rgba(0,0,0,.5);
    display: flex; flex-direction: column; gap: 16px;
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .lens {
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #9fd8ff, #1e74c9 60%, #0b3a6b);
    border: 4px solid #fff; flex: none;
    box-shadow: 0 0 0 3px var(--shell-dark);
  }
  .lens.blink { animation: blink .5s ease 2; }
  @keyframes blink { 50% { filter: brightness(1.8); } }
  .leds { display: flex; gap: 6px; }
  .leds span { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--shell-dark); }
  .leds span:nth-child(1) { background: #ff5a5f; }
  .leds span:nth-child(2) { background: var(--gold); }
  .leds span:nth-child(3) { background: #5ad16f; }
  h1 {
    font-family: var(--font-display); font-size: clamp(10px, 2.6vw, 14px);
    color: #fff; margin: 0 0 0 auto; text-align: right; line-height: 1.6;
    text-shadow: 2px 2px 0 var(--shell-dark);
  }

  .bezel { background: #e9e4dc; border-radius: 10px 10px 10px 36px; padding: 14px 16px 22px; }
  .screen {
    background: var(--screen); color: var(--screen-ink);
    border-radius: 6px; min-height: 340px; position: relative; overflow: hidden;
    border: 3px solid #4d5a46;
    display: flex; flex-direction: column;
  }
  .hud {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-family: var(--font-display); font-size: 10px; padding: 10px 12px;
    border-bottom: 2px dashed #9aab8c; font-variant-numeric: tabular-nums;
  }
  .lives { letter-spacing: 2px; color: var(--bad); }
  .timer { height: 6px; background: #b9c7ac; }
  .timer > div { height: 100%; width: 100%; background: var(--screen-ink); transform-origin: left; }
  .stage {
    flex: 1; display: grid; place-items: center; position: relative; padding: 12px;
    background: repeating-radial-gradient(circle at 50% 55%, transparent 0 18px, rgba(29,43,26,.06) 18px 20px);
  }
  .stage { overflow: hidden; }
  .stage img {
    width: min(240px, 60vw); aspect-ratio: 1; object-fit: contain; max-width: 100%;
    filter: brightness(0); transition: filter .6s ease, transform .6s ease;
    image-rendering: auto; user-select: none; -webkit-user-drag: none;
  }
  .stage img.reveal { filter: none; transform: scale(1.06); }
  .hud { flex-wrap: wrap; }
  .lvl { background: var(--screen-ink); color: var(--screen); padding: 3px 6px; border-radius: 4px; }
  .lvlup { background: var(--gold); color: var(--ink); }
  .field { display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 13px; }
  .field input {
    font-family: var(--font-display); font-size: 12px; padding: 10px; border-radius: 8px;
    border: 2px solid var(--screen-ink); background: #f3f7ec; color: var(--screen-ink); text-transform: uppercase;
  }
  .field input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .board { max-height: 300px; overflow: auto; }
  .board table { width: 100%; border-collapse: collapse; font-family: var(--font-display); font-size: 9px; line-height: 1.6; }
  .board th { font-family: var(--font-display); font-size: 8px; text-align: left; padding: 6px 4px; border-bottom: 2px solid var(--screen-ink); position: sticky; top: 0; background: var(--screen); }
  .board td { padding: 8px 4px; border-bottom: 1px dashed #9aab8c; overflow-wrap: anywhere; }
  .board td.r { text-align: right; white-space: nowrap; }
  /* en pantallas estrechas se ocultan las columnas secundarias (nivel, aciertos, partidas) */
  @media (max-width: 520px) { .board .x { display: none; } }
  .board th.r { text-align: right; }
  .board tr.me td { background: #c4d6b0; font-weight: 800; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs .small[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
  .empty { padding: 20px 0; text-align: center; }
  .loading { font-family: var(--font-display); font-size: 10px; }
  .pokeball {
    width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 12px;
    background: linear-gradient(var(--shell) 0 46%, var(--screen-ink) 46% 54%, #fff 54%);
    border: 3px solid var(--screen-ink); animation: wobble 1s ease-in-out infinite;
  }
  @keyframes wobble { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(15deg); } }

  .info { padding: 10px 12px 14px; text-align: center; min-height: 92px; }
  .info .name { font-family: var(--font-display); font-size: 14px; margin: 4px 0 8px; text-transform: capitalize; }
  .info .flavor { font-size: 14px; margin: 8px auto 0; max-width: 42ch; line-height: 1.4; }
  .types { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .type { font-size: 12px; font-weight: 800; color: #fff; padding: 3px 10px; border-radius: 999px; text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .num { font-family: var(--font-display); font-size: 9px; color: #55634c; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    font-family: var(--font-body); font-weight: 800; font-size: 16px;
    background: var(--panel); color: var(--ink);
    border: none; border-radius: 10px; padding: 14px 10px; cursor: pointer;
    box-shadow: 0 5px 0 var(--shell-dark); transition: transform .08s, box-shadow .08s, background .2s;
    display: flex; align-items: center; gap: 8px; text-align: left; min-width: 0;
  }
  .opt kbd {
    font-family: var(--font-display); font-size: 9px; background: var(--ink); color: var(--panel);
    border-radius: 4px; padding: 4px 5px; flex: none;
  }
  .opt span { overflow-wrap: anywhere; }
  .opt:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--shell-dark); }
  .opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--shell-dark); }
  .opt:disabled { cursor: default; }
  .opt.correct { background: var(--ok); color: #fff; }
  .opt.wrong { background: var(--bad); color: #fff; }
  .opt.dim { opacity: .55; }
  button:focus-visible, input:focus-visible + .chip { outline: 3px solid var(--gold); outline-offset: 2px; }

  .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .small {
    font-family: var(--font-display); font-size: 9px; background: var(--ink); color: #fff;
    border: none; border-radius: 999px; padding: 10px 14px; cursor: pointer;
  }
  .big {
    font-family: var(--font-display); font-size: 12px; background: var(--gold); color: var(--ink);
    border: none; border-radius: 12px; padding: 16px 20px; cursor: pointer; width: 100%;
    box-shadow: 0 5px 0 #b08a00;
  }
  .big:active { transform: translateY(4px); box-shadow: 0 1px 0 #b08a00; }

  .menu { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .menu h2 { font-family: var(--font-display); font-size: 12px; margin: 0; line-height: 1.6; }
  .menu p { margin: 0; line-height: 1.45; }
  .gens { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .gens label { position: relative; }
  .gens input { position: absolute; opacity: 0; }
  .chip {
    display: block; text-align: center; padding: 8px 4px; border-radius: 8px; cursor: pointer;
    border: 2px solid var(--screen-ink); font-weight: 800; font-size: 13px;
  }
  .chip small { display: block; font-weight: 600; font-size: 11px; opacity: .75; }
  .gens input:checked + .chip { background: var(--screen-ink); color: var(--screen); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .best { font-family: var(--font-display); font-size: 10px; }
  .err { color: var(--bad); font-weight: 800; }
  .over { text-align: center; }
  .over .score { font-family: var(--font-display); font-size: 28px; margin: 6px 0; }
  .toast {
    position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-display); font-size: 11px; padding: 8px 12px; border-radius: 6px;
    background: var(--screen-ink); color: var(--screen); white-space: nowrap;
  }
  /* Consola + panel lateral; en pantallas estrechas el panel baja debajo */
  .layout { width: 100%; max-width: 880px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; justify-content: center; }
  .dex { flex: 1 1 400px; }
  .side {
    flex: 1 1 260px; max-width: 560px; min-width: 0;
    background: var(--panel); color: var(--ink); border-radius: 16px; padding: 18px;
    box-shadow: inset 0 -6px 0 #d9cdb8, 0 20px 50px rgba(0,0,0,.4);
    display: flex; flex-direction: column; gap: 14px;
  }
  .side h3 { font-family: var(--font-display); font-size: 10px; margin: 0; letter-spacing: 1px; color: var(--muted); }
  .champ {
    background: var(--ink); color: var(--panel); border-radius: 12px; padding: 16px; text-align: center;
    border: 3px solid var(--gold); display: flex; flex-direction: column; gap: 8px;
  }
  .champ .crown { font-family: var(--font-display); font-size: 9px; color: var(--gold); letter-spacing: 1px; }
  .champ .who { font-family: var(--font-display); font-size: 15px; overflow-wrap: anywhere; line-height: 1.5; }
  .champ .pts { font-family: var(--font-display); font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .champ .meta { font-family: var(--font-display); font-size: 8px; line-height: 1.8; opacity: .8; }
  .top10 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums; }
  .top10 li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: baseline; padding: 8px; border-radius: 6px; font-family: var(--font-display); font-size: 10px; line-height: 1.5; }
  .top10 li:nth-child(odd) { background: #f1e9db; }
  .top10 li.me { background: var(--gold); font-weight: 800; }
  .top10 .pos { font-family: var(--font-display); font-size: 9px; color: var(--muted); }
  .top10 .u { overflow-wrap: anywhere; font-weight: 800; }
  .side .note { font-size: 12px; color: var(--muted); margin: 0; }
  .auth { display: flex; flex-direction: column; gap: 10px; }
  .field input.plain { text-transform: none; }
  .link { background: none; border: none; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; font-weight: 800; padding: 0; align-self: flex-start; }
  .ok-msg { color: var(--ok); font-weight: 800; }
  .modes { display: flex; flex-direction: column; gap: 10px; }
  .mode-card {
    display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer;
    background: var(--screen-ink); color: var(--screen); border: none; border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 4px 0 #0b120a; font: inherit; transition: transform .08s, box-shadow .08s;
  }
  .mode-card:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #0b120a; }
  .mode-card:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b120a; }
  .mode-name { font-family: var(--font-display); font-size: 11px; line-height: 1.5; }
  .mode-desc { font-size: 14px; line-height: 1.4; opacity: .85; }
  .mode-soon { font-size: 13px; opacity: .7; }
  /* nombre del modo del ranking, con la fuente pixelada del título */
  .mode-tag {
    font-family: var(--font-display); font-size: 13px; line-height: 1.6; letter-spacing: 1px; text-align: center;
    color: var(--shell);
  }
  .menu .mode-tag { font-size: 12px; }
  @media (max-width: 420px) { .opt { font-size: 14px; padding: 12px 8px; } .dex { padding: 14px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="layout">
<main class="dex">
  <div class="top">
    <div class="lens" id="lens"></div>
    <div class="leds"><span></span><span></span><span></span></div>
    <h1>¿QUIÉN ES ESE<br>POKÉMON?</h1>
  </div>

  <div class="bezel">
    <div class="screen" id="screen"></div>
  </div>

  <div class="controls" id="controls"></div>

  <div class="bottom">
    <button class="small" id="soundBtn" type="button">SONIDO: ON</button>
    <button class="small" id="menuBtn" type="button">MENÚ</button>
  </div>
</main>

<aside class="side" aria-label="Ranking">
  <h3>RANKING</h3>
  <div class="mode-tag" id="sideMode"></div>
  <h3>MEJOR ENTRENADOR</h3>
  <div class="champ" id="champ"><div class="meta">Cargando ranking…</div></div>
  <h3>TOP 10</h3>
  <ol class="top10" id="top10"></ol>
  <p class="note" id="sideNote"></p>
</aside>
</div>

<script src="config.js"></script>
<script>
const API = "https://pokeapi.co/api/v2";
const GENS = [
  { n: 1, name: "Kanto",  from: 1,   to: 151 },
  { n: 2, name: "Johto",  from: 152, to: 251 },
  { n: 3, name: "Hoenn",  from: 252, to: 386 },
  { n: 4, name: "Sinnoh", from: 387, to: 493 },
  { n: 5, name: "Teselia", from: 494, to: 649 },
  { n: 6, name: "Kalos",  from: 650, to: 721 },
  { n: 7, name: "Alola",  from: 722, to: 809 },
  { n: 8, name: "Galar",  from: 810, to: 905 },
  { n: 9, name: "Paldea", from: 906, to: 1025 },
];
const TYPES = {
  normal: ["Normal", "#9fa19f"], fire: ["Fuego", "#e62829"], water: ["Agua", "#2980ef"],
  grass: ["Planta", "#3fa129"], electric: ["Eléctrico", "#d8a800"], ice: ["Hielo", "#3dcef3"],
  fighting: ["Lucha", "#ff8000"], poison: ["Veneno", "#9141cb"], ground: ["Tierra", "#915121"],
  flying: ["Volador", "#81b9ef"], psychic: ["Psíquico", "#ef4179"], bug: ["Bicho", "#91a119"],
  rock: ["Roca", "#afa981"], ghost: ["Fantasma", "#704170"], dragon: ["Dragón", "#5060e1"],
  dark: ["Siniestro", "#624d4e"], steel: ["Acero", "#60a1b8"], fairy: ["Hada", "#ef70ef"],
};
const HITS_PER_LEVEL = 5;  // aciertos necesarios para subir de nivel

// La partida la arbitra la base de datos (supabase.sql: start_game, start_round, answer_round, end_game):
// elige el Pokémon, mide el tiempo, corrige y guarda la puntuación. Aquí solo se pinta.
// Efectos visuales por nivel
const mirrored    = lvl => lvl >= 5;                                   // silueta en espejo
const zoomed      = lvl => lvl >= 7;                                   // silueta recortada

// Modos de juego. Cada modo tiene su propio ranking en la base de datos (columna scores.mode = clave).
// Para añadir uno: nueva entrada aquí con su pantalla de inicio (setup).
const MODES = {
  silueta: {
    name: "¿Quién es ese Pokémon?",
    short: "Silueta",
    desc: "Adivina el Pokémon por su silueta. Un fallo y se acaba; cada nivel, menos tiempo.",
    setup: () => showSiluetaSetup(),
  },
};

const $screen = document.getElementById("screen");
const $controls = document.getElementById("controls");
const $lens = document.getElementById("lens");
const $soundBtn = document.getElementById("soundBtn");

const cache = new Map();   // id -> datos del pokémon
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let state = null;
let sound = store.get("wtp-sound", true);
let selectedGens = store.get("wtp-gens", [1]);
let session = store.get("wtp-session", null);   // { token, username } o null
let guest = false;                               // jugando sin cuenta: no se guarda nada
let currentMode = store.get("wtp-mode", "silueta");
if (!MODES[currentMode]) currentMode = "silueta";
const RANKING_MODE = "silueta";                  // el ranking solo muestra este modo
let timerId = null;

function renderSound() { $soundBtn.textContent = "SONIDO: " + (sound ? "ON" : "OFF"); }
$soundBtn.onclick = () => { sound = !sound; store.set("wtp-sound", sound); renderSound(); };
document.getElementById("menuBtn").onclick = () => {
  stopTimer();
  // partida abandonada: la base de datos la cierra y guarda los puntos que lleve
  if (state && state.game && !state.over) {
    const mode = state.mode;
    rpc("end_game", { p_game: state.game }).then(res => {
      if (res && mode === RANKING_MODE) refreshSide();
    }, () => {});
  }
  showMenu();
};
renderSound();

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* ---------- Servidor (server/api.php: hace de árbitro y guarda los datos) ---------- */
const DB = window.POKE_DB || {};
const dbReady = !!DB.api;

async function rpc(fn, params = {}) {
  if (!dbReady) throw new Error("El servidor no está configurado (config.js).");
  let r;
  try {
    r = await fetch(`${DB.api}?fn=${encodeURIComponent(fn)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(params),
    });
  } catch {
    throw new Error("No se pudo conectar con la base de datos.");
  }
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error((data && data.message) || "Error de la base de datos (" + r.status + ")");
  return data;
}

function setSession(s) {
  session = s;
  store.set("wtp-session", s);
}

// comprueba al cargar que la sesión guardada sigue siendo válida
async function checkSession() {
  if (!session || !dbReady) return;
  try {
    const name = await rpc("whoami", { p_token: session.token });
    if (!name) { setSession(null); if (!state) showMenu(); }
  } catch {}
}

/* ---------- Panel lateral: campeón y top 10 del modo elegido ---------- */
document.getElementById("sideMode").textContent = "MODO " + MODES[RANKING_MODE].short.toUpperCase();

let sideReq = 0;
async function refreshSide() {
  const $champ = document.getElementById("champ");
  const $top = document.getElementById("top10");
  const $note = document.getElementById("sideNote");
  if (!dbReady) {
    $champ.innerHTML = `<div class="meta">Ranking no disponible: falta configurar la base de datos.</div>`;
    return;
  }
  const req = ++sideReq;
  try {
    const rows = await rpc("leaderboard", { p_mode: RANKING_MODE, p_limit: 10 });
    if (req !== sideReq) return;  // llegó tarde: ya se pidió otro modo
    if (!rows.length) {
      $champ.innerHTML = `<div class="crown">CAMPEÓN</div><div class="meta">Nadie ha jugado todavía. ¡El primer puesto es tuyo!</div>`;
      $top.innerHTML = "";
    } else {
      const c = rows[0];
      $champ.innerHTML = `
        <div class="crown">★ CAMPEÓN ★</div>
        <div class="who">${esc(c.username)}</div>
        <div class="pts">${c.best_score}</div>
        <div class="meta">Nivel ${c.level} · ${c.hits} aciertos · media ${fmtSec(c.avg_time)}</div>`;
      $top.innerHTML = rows.map((r, i) => `
        <li class="${session && r.username === session.username ? "me" : ""}">
          <span class="pos">${i + 1}</span><span class="u">${esc(r.username)}</span><span>${r.best_score}</span>
        </li>`).join("");
    }
    $note.textContent = "Actualizado a las " + new Date().toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    $note.textContent = e.message;
  }
}
setInterval(() => { if (!document.hidden) refreshSide(); }, 30000);

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// Grito y descripción en español del Pokémon (solo se piden después de responder)
async function getPokemon(id) {
  if (cache.has(id)) return cache.get(id);
  const p = Promise.all([getJSON(`${API}/pokemon/${id}`), getJSON(`${API}/pokemon-species/${id}`)])
    .then(([pk, sp]) => {
      const flav = sp.flavor_text_entries.filter(f => f.language.name === "es").pop();
      return {
        cry: pk.cries?.latest || pk.cries?.legacy || null,
        flavor: flav ? flav.flavor_text.replace(/[\n\f­]+/g, " ") : "",
      };
    });
  cache.set(id, p);
  p.catch(() => cache.delete(id));
  return p;
}

// precarga una imagen para que la silueta aparezca de golpe
function preload(src) {
  return new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = src; });
}

/* ---------- Pantallas ---------- */
function showLogin(msg = "") {
  state = null;
  $screen.innerHTML = `
    <form class="menu auth" id="authForm" novalidate>
      <h2>Entra para guardar tus partidas</h2>
      <p>Solo necesitas un usuario y una contraseña. Si no tienes cuenta, escribe los que quieras y pulsa CREAR CUENTA.</p>
      <label class="field" for="authUser">Usuario
        <input id="authUser" class="plain" maxlength="16" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ash_ketchum">
      </label>
      <label class="field" for="authPass">Contraseña
        <input id="authPass" class="plain" type="password" autocomplete="current-password" placeholder="mínimo 4 caracteres">
      </label>
      <div class="err" id="authErr">${esc(msg)}</div>
      ${dbReady ? "" : `<p class="err">La base de datos no está configurada todavía (config.js). Puedes jugar sin cuenta.</p>`}
      <button class="link" type="button" id="guestBtn">Jugar sin cuenta (no se guarda nada)</button>
      <button type="submit" hidden></button>
    </form>`;
  $controls.innerHTML = `
    <button class="big" type="button" id="loginBtn">ENTRAR</button>
    <button class="big" type="button" id="signupBtn">CREAR CUENTA</button>`;

  const $err = document.getElementById("authErr");
  const go = async kind => {
    const u = document.getElementById("authUser").value.trim().toLowerCase();
    const p = document.getElementById("authPass").value;
    if (!/^[a-z0-9_]{3,16}$/.test(u)) { $err.textContent = "El usuario debe tener de 3 a 16 caracteres: letras, números o _"; return; }
    if (p.length < 4) { $err.textContent = "La contraseña debe tener al menos 4 caracteres."; return; }
    $err.textContent = "Conectando…";
    $controls.querySelectorAll("button").forEach(b => b.disabled = true);
    try {
      const s = await rpc(kind, { p_username: u, p_password: p });
      setSession(s);
      guest = false;
      showMenu();
      refreshSide();
    } catch (e) {
      $err.textContent = e.message;
      $controls.querySelectorAll("button").forEach(b => b.disabled = false);
    }
  };
  document.getElementById("loginBtn").onclick = () => go("login");
  document.getElementById("signupBtn").onclick = () => go("register");
  document.getElementById("authForm").onsubmit = e => { e.preventDefault(); go("login"); };
  document.getElementById("authForm").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go("login"); } };
  document.getElementById("guestBtn").onclick = () => { guest = true; showMenu(); };
  document.getElementById("authUser").focus();
}

async function logout() {
  const t = session && session.token;
  setSession(null);
  guest = false;
  showLogin();
  refreshSide();
  if (t) rpc("logout", { p_token: t }).catch(() => {});
}

// Menú principal: elegir modo de juego
function showMenu() {
  stopTimer();
  state = null;
  if (!session && !guest) return showLogin();
  $screen.innerHTML = `
    <div class="menu">
      <p>${session
        ? `Jugando como <b>${esc(session.username)}</b>. <button class="link" type="button" id="logoutBtn">Salir</button>`
        : `Jugando sin cuenta: tus partidas no se guardan. <button class="link" type="button" id="toLogin">Entrar</button>`}</p>
      <h2>Elige modo de juego</h2>
      <div class="modes">
        ${Object.entries(MODES).map(([id, m]) => `
          <button class="mode-card" type="button" data-mode="${id}">
            <span class="mode-name">${esc(m.name)}</span>
            <span class="mode-desc">${esc(m.desc)}</span>
          </button>`).join("")}
      </div>
      <p class="mode-soon">Pronto habrá más modos.</p>
    </div>`;
  const $lo = document.getElementById("logoutBtn");
  if ($lo) $lo.onclick = logout;
  const $tl = document.getElementById("toLogin");
  if ($tl) $tl.onclick = () => { guest = false; showLogin(); };
  $screen.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    currentMode = b.dataset.mode;
    store.set("wtp-mode", currentMode);
    MODES[currentMode].setup();
  });
  $controls.innerHTML = `<button class="big" type="button" id="boardBtn" style="grid-column:1/-1">SCOREBOARD</button>`;
  document.getElementById("boardBtn").onclick = () => showBoard("top");
}

/* ---------- Modo "silueta" ---------- */
function showSiluetaSetup() {
  state = null;
  $screen.innerHTML = `
    <div class="menu">
      <h2>${esc(MODES.silueta.name)}</h2>
      <p>Un fallo y se acaba la partida. Cada ${HITS_PER_LEVEL} aciertos subes de nivel: menos tiempo, más opciones, opciones del mismo tipo, siluetas en espejo y recortadas. Usa las teclas 1 a 8 para responder rápido.</p>
      <div class="gens" id="gens">
        ${GENS.map(g => `
          <label><input type="checkbox" id="gen${g.n}" value="${g.n}" ${selectedGens.includes(g.n) ? "checked" : ""}>
          <span class="chip">Gen ${g.n}<small>${g.name}</small></span></label>`).join("")}
      </div>
      <div class="row">
        <button class="small" type="button" id="allBtn">TODAS</button>
        <button class="small" type="button" id="noneBtn">SOLO KANTO</button>
      </div>
      <div class="err" id="err"></div>
    </div>`;
  const setAll = v => { document.querySelectorAll("#gens input").forEach((c, i) => c.checked = v === "all" || i === 0); };
  document.getElementById("allBtn").onclick = () => setAll("all");
  document.getElementById("noneBtn").onclick = () => setAll("kanto");
  $controls.innerHTML = `
    <button class="big" type="button" id="startBtn">¡JUGAR!</button>
    <button class="big" type="button" id="backBtn">VOLVER</button>`;
  document.getElementById("startBtn").onclick = readGens;
  document.getElementById("backBtn").onclick = showMenu;
}

function newState(start) {
  return { mode: "silueta", game: start.game, nextImg: start.img, score: 0, level: 1, hits: 0, streak: 0, round: 0, avg: null, over: false };
}

function readGens() {
  const checked = [...document.querySelectorAll("#gens input:checked")].map(c => +c.value);
  if (!checked.length) { document.getElementById("err").textContent = "Elige al menos una generación."; return; }
  selectedGens = checked; store.set("wtp-gens", checked);
  startGame();
}

// pide a la base de datos una partida nueva con las generaciones elegidas
async function startGame() {
  stopTimer();
  state = null;
  $screen.innerHTML = `<div class="stage"><div class="loading"><div class="pokeball"></div>EMPEZANDO…</div></div>`;
  $controls.innerHTML = "";
  try {
    const start = await rpc("start_game", { p_token: session ? session.token : null, p_mode: "silueta", p_gens: selectedGens });
    state = newState(start);
    playRound();
  } catch (e) {
    if (/sesión/i.test(e.message)) { setSession(null); return showLogin(e.message); }
    showError(e.message, startGame);
  }
}

function showError(msg, retry) {
  $screen.innerHTML = `<div class="stage"><div class="loading err">${esc(msg)}<br><br>Revisa tu conexión.</div></div>`;
  $controls.innerHTML = `
    <button class="big" type="button" id="retry">REINTENTAR</button>
    <button class="big" type="button" id="toMenu">MENÚ</button>`;
  document.getElementById("retry").onclick = retry;
  document.getElementById("toMenu").onclick = showMenu;
}

function hud() {
  return `<div class="hud">
    <span class="lvl">NIV ${state.level}</span>
    <span>PTS ${String(state.score).padStart(6, "0")}</span>
    <span>x${state.streak}</span>
    <span>MEDIA ${fmtSec(state.avg)}</span>
  </div>`;
}

async function playRound() {
  stopTimer();
  const g = state;
  $screen.innerHTML = `${hud()}<div class="stage"><div class="loading"><div class="pokeball"></div>CARGANDO…</div></div>`;
  $controls.innerHTML = "";
  let round;
  try {
    // primero la imagen y luego la ronda: el reloj del servidor empieza al pedir la ronda
    await preload(g.nextImg);
    if (state !== g) return;  // volvió al menú mientras cargaba
    round = await rpc("start_round", { p_game: g.game });
  } catch (e) {
    if (state !== g) return;
    showError(e.message, playRound);
    return;
  }
  if (state !== g) return;
  g.round = round.round;
  g.answered = false;

  const lvl = round.level;
  const tf = [];
  if (zoomed(lvl)) tf.push("scale(1.9)");
  if (mirrored(lvl)) tf.push("scaleX(-1)");
  const origin = zoomed(lvl) ? `transform-origin:${rand(25, 75)}% ${rand(25, 75)}%;` : "";
  $screen.innerHTML = `${hud()}
    <div class="timer"><div id="bar"></div></div>
    <div class="stage"><img id="poke" src="${esc(round.img)}" alt="Silueta de un Pokémon misterioso" draggable="false" style="${tf.length ? `transform:${tf.join(" ")};` : ""}${origin}"></div>
    <div class="info" id="info"><div class="num">RONDA ${round.round} · ${round.time.toFixed(1)}s</div><div class="name">???</div></div>`;
  $controls.innerHTML = round.options.map((name, i) =>
    `<button class="opt" type="button" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(name)}</span></button>`).join("");
  $controls.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
  startTimer(round.time);
}

// la barra es solo visual: el tiempo de verdad lo mide el servidor
function startTimer(total) {
  const bar = document.getElementById("bar");
  const t0 = performance.now();
  const tick = () => {
    const left = Math.max(0, total - (performance.now() - t0) / 1000);
    if (bar) bar.style.transform = `scaleX(${left / total})`;
    if (left <= 0) { answer(null); return; }
    timerId = requestAnimationFrame(tick);
  };
  timerId = requestAnimationFrame(tick);
}
function stopTimer() { if (timerId) cancelAnimationFrame(timerId); timerId = null; }

// choice = posición de la opción (0…7), o null si se acabó el tiempo
async function answer(choice) {
  const g = state;
  if (!g || g.answered !== false) return;
  g.answered = true;
  stopTimer();
  const $opts = [...$controls.querySelectorAll(".opt")];
  $opts.forEach(b => b.disabled = true);

  let res;
  try {
    res = await rpc("answer_round", { p_game: g.game, p_choice: choice });
  } catch (e) {
    if (state !== g) return;
    $screen.innerHTML = `<div class="stage"><div class="loading err">${esc(e.message)}</div></div>`;
    $controls.innerHTML = `<button class="big" type="button" id="toMenu" style="grid-column:1/-1">MENÚ</button>`;
    document.getElementById("toMenu").onclick = showMenu;
    return;
  }
  if (state !== g) return;

  Object.assign(g, { score: res.score, level: res.level, hits: res.hits, streak: res.streak, avg: res.avg_time,
                     over: res.over, nextImg: res.next_img, saved: res.saved });
  const ans = res.answer;
  $opts.forEach((b, i) => {
    if (i === res.correct) b.classList.add("correct");
    else if (i === choice) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const img = document.getElementById("poke");
  if (img) { img.style.transform = ""; img.style.transformOrigin = ""; img.classList.add("reveal"); img.alt = ans.name; }
  if (res.next_img) preload(res.next_img);  // precarga la siguiente
  $lens.classList.remove("blink"); void $lens.offsetWidth; $lens.classList.add("blink");
  document.querySelector(".hud").outerHTML = hud();
  const $info = document.getElementById("info");
  $info.innerHTML = `
    <div class="num">Nº ${String(ans.id).padStart(4, "0")}</div>
    <div class="name">${esc(ans.name)}</div>
    <div class="types">${ans.types.map(t => `<span class="type" style="background:${(TYPES[t] || [t, "#777"])[1]}">${esc((TYPES[t] || [t])[0])}</span>`).join("")}</div>`;
  getPokemon(ans.id).then(p => {
    if (p.flavor && $info.isConnected) $info.insertAdjacentHTML("beforeend", `<p class="flavor">${esc(p.flavor)}</p>`);
    if (sound && p.cry && state === g) { const a = new Audio(p.cry); a.volume = 0.35; a.play().catch(() => {}); }
  }, () => {});

  const stage = document.querySelector(".stage");
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.textContent = res.ok ? `¡CORRECTO! +${res.gained}` : res.late ? "¡TIEMPO!" : "¡FALLASTE!";
  stage.appendChild(toast);
  if (res.level_up) {
    const up = document.createElement("div");
    up.className = "toast lvlup"; up.style.top = "84px";
    up.textContent = `¡NIVEL ${res.level}! ${res.next_time.toFixed(1)}s`;
    stage.appendChild(up);
  }

  const btn = document.createElement("button");
  btn.className = "big"; btn.type = "button"; btn.style.gridColumn = "1/-1"; btn.style.marginTop = "6px";
  btn.textContent = res.over ? "VER RESULTADO" : "SIGUIENTE ▶";
  btn.onclick = () => res.over ? gameOver() : playRound();
  $controls.appendChild(btn);
  btn.focus();
  if (res.saved && g.mode === RANKING_MODE) refreshSide();
}

function gensLabel(gens) {
  return gens.length === GENS.length ? "Todas" : gens.join(",");
}

function fmtSec(s) { return s == null ? "—" : s.toFixed(2) + "s"; }

function gameOver() {
  const g = state;
  state = null;
  const saved = g.saved
    ? `<span class="ok-msg">Partida guardada.</span> Tu mejor puntuación: <b>${g.saved.best}</b> · puesto <b>#${g.saved.rank}</b> del ranking de este modo.`
    : session ? "" : "Jugando sin cuenta: esta partida no se guarda.";
  $screen.innerHTML = `
    <div class="menu over">
      <h2>FIN DEL JUEGO · ${esc(MODES[g.mode].short.toUpperCase())}</h2>
      <div class="score">${g.score}</div>
      <p>${session ? esc(session.username) + " · " : ""}Nivel ${g.level} · ${g.hits} aciertos</p>
      <p>Tiempo medio por respuesta: <b>${fmtSec(g.avg)}</b></p>
      <p>${saved}</p>
    </div>`;
  $controls.innerHTML = `
    <button class="big" type="button" id="again">OTRA VEZ</button>
    <button class="big" type="button" id="toBoard">SCOREBOARD</button>`;
  document.getElementById("again").onclick = startGame;
  document.getElementById("toBoard").onclick = () => showBoard("top");
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("es", { day: "2-digit", month: "2-digit" }) + " " +
         d.toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" });
}

let boardReq = 0;  // evita pintar una respuesta antigua si se cambia de pestaña rápido
async function showBoard(tab = "top") {
  const mode = RANKING_MODE;
  stopTimer();
  state = null;
  const req = ++boardReq;
  $screen.innerHTML = `
    <div class="menu">
      <h2>SCOREBOARD</h2>
      <div class="mode-tag">MODO ${esc(MODES[mode].short.toUpperCase())}</div>
      <div class="tabs">
        <button class="small" type="button" data-tab="top" aria-pressed="${tab === "top"}">RANKING</button>
        ${session ? `<button class="small" type="button" data-tab="mine" aria-pressed="${tab === "mine"}">MIS PARTIDAS</button>` : ""}
      </div>
      <div id="boardBody" class="loading">CARGANDO…</div>
    </div>`;
  $screen.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => showBoard(b.dataset.tab));
  $controls.innerHTML = `<button class="big" type="button" id="toMenu" style="grid-column:1/-1">MENÚ</button>`;
  document.getElementById("toMenu").onclick = showMenu;

  let html;
  try {
    if (tab === "mine" && session) {
      const rows = await rpc("my_scores", { p_token: session.token, p_mode: mode, p_limit: 50 });
      html = rows.length ? `
        <div class="board"><table>
          <thead><tr><th>FECHA</th><th class="r">PTS</th><th class="r x">NIV</th><th class="r x">ACI</th><th class="r">T.MEDIO</th><th>GEN</th></tr></thead>
          <tbody>${rows.map(a => `
            <tr><td>${fmtDate(a.created_at)}</td><td class="r">${a.score}</td><td class="r x">${a.level}</td>
            <td class="r x">${a.hits}</td><td class="r">${fmtSec(a.avg_time)}</td><td>${esc(gensLabel(a.gens || []))}</td></tr>`).join("")}</tbody>
        </table></div>` : `<p class="empty">Todavía no tienes partidas guardadas.</p>`;
    } else {
      const rows = await rpc("leaderboard", { p_mode: mode, p_limit: 50 });
      html = rows.length ? `
        <div class="board"><table>
          <thead><tr><th>#</th><th>JUGADOR</th><th class="r">PTS</th><th class="r x">NIV</th><th class="r x">ACI</th><th class="r">T.MEDIO</th><th class="r x">PARTIDAS</th></tr></thead>
          <tbody>${rows.map((a, i) => `
            <tr class="${session && a.username === session.username ? "me" : ""}">
            <td>${i + 1}</td><td>${esc(a.username)}</td><td class="r">${a.best_score}</td><td class="r x">${a.level}</td>
            <td class="r x">${a.hits}</td><td class="r">${fmtSec(a.avg_time)}</td><td class="r x">${a.games}</td></tr>`).join("")}</tbody>
        </table></div>
        <p>Mejor partida de cada jugador.</p>` : `<p class="empty">Nadie ha jugado todavía.</p>`;
    }
  } catch (e) {
    html = `<p class="err">${esc(e.message)}</p>`;
  }
  if (req !== boardReq) return;
  const body = document.getElementById("boardBody");
  if (body) { body.className = ""; body.innerHTML = html; }
}

document.addEventListener("keydown", e => {
  if (!state || state.answered !== false) return;
  if (e.target.tagName === "INPUT") return;
  const n = +e.key;
  if (n >= 1 && n <= 8 && $controls.querySelectorAll(".opt")[n - 1]) answer(n - 1);
});

showMenu();
refreshSide();
checkSession();
</script>
</body>
</html>
